[build-system]
requires = ["setuptools>=61.5", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mas4te-communication-agent"
version = "0.1.0"
description = "MAS4TE communication agent"
readme = "README.md"
# `str | None` annotations are evaluated at import time, so 3.10 is the floor.
requires-python = ">=3.11"   # tomllib, used by agents_config.py
authors = [ { name = "maintainer", email = "maintainer@example.com" } ]
license = { text = "MIT" }
dependencies = [
    # web app
    "fastapi >=0.110",
    "uvicorn[standard] >=0.27",
    "pydantic >=2.0",
    # market link
    "paho-mqtt >=2.0",
    # data + forecasting service client
    "pandas >=2.0",
    "numpy >=1.24",
    "requests >=2.31",
    "pyyaml >=6.0",
    # chat backend (Mistral and OpenAI both speak this protocol)
    "openai >=1.30",
    # The optimiser. Not on PyPI, so it comes from its public git repo and plain
    # `pip install -e .` resolves it without any local checkout.
    "battery-utility-calculator @ git+https://github.com/MAS4TE/battery-utility-calculator@main",
]

[project.optional-dependencies]
# Local LM Studio chat backend (config.LLM_BACKEND = "lmstudio").
lmstudio = ["lmstudio >=1.0"]
dev = ["pytest >=7.2"]

[project.scripts]
mas4te-agents = "launch:main"

[tool.setuptools]
py-modules = ["launch"]

[tool.setuptools.packages.find]
where = ["src"]
