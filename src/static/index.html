<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAS4TE Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #10a37f;
      --primary-dark: #0a8f6d;
      --primary-light: rgba(16, 163, 127, 0.12);
      --text: #1a1a2e;
      --text-muted: #6e7191;
      --bg: #f8f9fc;
      --surface: #ffffff;
      --border: #e4e7f0;
      --user-bubble: #10a37f;
      --panel-width: 280px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px; background: var(--surface);
      border-bottom: 1px solid var(--border); z-index: 10; flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-left img { height: 180px; }
    .header-title { font-size: 1.1rem; font-weight: 600; color: var(--primary); letter-spacing: -0.3px; }
    .header-subtitle { font-size: 0.72rem; color: var(--text-muted); margin-top: 1px; }
    .battery-pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--bg); border: 1px solid var(--border);
      padding: 5px 12px; border-radius: 20px;
      font-size: 0.82rem; font-weight: 500; color: var(--text-muted);
    }

    /* ── LAYOUT ── */
    .main-layout { display: flex; flex: 1; overflow: hidden; }

    /* ── CHAT ── */
    .chat-area {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; margin-right: var(--panel-width);
    }
    #chat-box {
      flex: 1; overflow-y: auto; padding: 24px 28px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .message {
      padding: 12px 16px; border-radius: 14px; max-width: 78%;
      word-wrap: break-word; font-size: 0.92rem; line-height: 1.6;
      animation: msgIn 0.2s ease;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .user-message {
      background: var(--user-bubble); color: white;
      align-self: flex-end; border-bottom-right-radius: 4px;
    }
    .assistant-message {
      background: var(--surface); border: 1px solid var(--border);
      align-self: flex-start; border-bottom-left-radius: 4px;
    }
    .input-area {
      display: flex; padding: 14px 24px; background: var(--surface);
      border-top: 1px solid var(--border); gap: 10px; flex-shrink: 0;
    }
    #user-input {
      flex: 1; padding: 11px 16px; border-radius: 10px;
      border: 1px solid var(--border); font-size: 0.92rem;
      font-family: 'DM Sans', sans-serif; outline: none;
      background: var(--bg); color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #user-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(16,163,127,0.15); background: #fff;
    }
    #send-btn {
      padding: 11px 20px; background: var(--primary); color: white;
      border: none; border-radius: 10px; font-size: 0.92rem; font-weight: 600;
      font-family: 'DM Sans', sans-serif; cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    #send-btn:hover { background: var(--primary-dark); transform: scale(1.02); }

    /* ── SIDE PANEL ── */
    #side-panel {
      position: fixed; top: 0; right: 0;
      width: var(--panel-width); height: 100vh;
      background: var(--surface); border-left: 1px solid var(--border);
      z-index: 100; display: flex; flex-direction: column;
      box-shadow: -4px 0 20px rgba(0,0,0,0.05);
    }

    /* ── TABS ── */
    .panel-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .panel-tab {
      flex: 1; padding: 14px 0; background: none; border: none;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      font-family: 'DM Sans', sans-serif; font-size: 0.82rem; font-weight: 600;
      color: var(--text-muted); cursor: pointer; transition: color 0.2s, border-color 0.2s;
    }
    .panel-tab:hover { color: var(--text); }
    .panel-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

    .tab-content { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
    .panel-body {
      padding: 22px 20px; display: flex; flex-direction: column;
      gap: 28px; flex: 1; overflow-y: auto;
    }

    /* ── SLIDERS ── */
    .pref-section label {
      display: block; font-size: 0.75rem; font-weight: 600;
      color: var(--text-muted); letter-spacing: 0.06em;
      text-transform: uppercase; margin-bottom: 14px;
    }
    .step-track {
      position: relative; height: 6px;
      background: var(--border); border-radius: 4px; margin: 0 10px;
    }
    .step-fill {
      position: absolute; left: 0; top: 0; height: 100%;
      border-radius: 4px; transition: width 0.3s ease, background 0.3s ease;
    }
    .step-dots {
      position: absolute; top: 50%; transform: translateY(-50%);
      left: 0; right: 0; display: flex; justify-content: space-between;
    }
    .step-dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--surface); border: 2px solid var(--border);
      cursor: pointer; z-index: 1;
      transition: border-color 0.2s, transform 0.2s, background 0.2s;
    }
    .step-dot.active { transform: scale(1.25); }
    .step-range {
      position: absolute; top: -8px; left: 0; right: 0;
      width: 100%; opacity: 0; cursor: pointer; height: 22px; margin: 0;
    }
    .step-labels { display: flex; justify-content: space-between; margin: 10px 10px 0; }
    .step-label {
      font-size: 0.76rem; font-weight: 500; color: var(--text-muted);
      transition: color 0.2s; text-align: center; cursor: pointer;
    }
    .step-label.active { font-weight: 700; }
    .pref-summary {
      padding: 10px 14px; background: var(--bg);
      border-radius: 10px; border: 1px solid var(--border);
      font-size: 0.8rem; color: var(--text-muted); line-height: 1.5;
    }
    .pref-summary span { font-weight: 600; color: var(--text); }

    /* ── BATTERY RESERVE SLIDER ── */
    #battery-reserve-section {
      display: none; /* shown dynamically when profile has battery */
    }
    .reserve-slider-wrap { padding: 0 2px; }
    .reserve-track {
      position: relative; height: 10px;
      background: var(--border); border-radius: 6px;
      overflow: visible; margin: 0 4px;
    }
    /* the "keep" zone fills from left */
    .reserve-keep-fill {
      position: absolute; left: 0; top: 0; height: 100%;
      background: #10a37f; border-radius: 6px 0 0 6px;
      transition: width 0.2s ease;
      pointer-events: none;
    }
    /* the "tradeable" zone fills from keep to right */
    .reserve-trade-fill {
      position: absolute; top: 0; height: 100%;
      background: #6366f1; border-radius: 0 6px 6px 0;
      transition: left 0.2s ease, width 0.2s ease;
      pointer-events: none;
    }
    .reserve-thumb {
      position: absolute; top: 50%; transform: translate(-50%, -50%);
      width: 20px; height: 20px; border-radius: 50%;
      background: white; border: 2.5px solid #10a37f;
      box-shadow: 0 1px 4px rgba(0,0,0,0.18);
      transition: left 0.2s ease;
      pointer-events: none;
      z-index: 2;
    }
    .reserve-range {
      position: absolute; top: 50%; left: 0; right: 0;
      transform: translateY(-50%);
      width: 100%; opacity: 0; cursor: pointer;
      height: 28px; margin: 0; z-index: 3;
    }
    .reserve-legend {
      display: flex; justify-content: space-between;
      margin-top: 14px; gap: 8px;
    }
    .reserve-legend-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.78rem; color: var(--text-muted);
    }
    .reserve-legend-dot {
      width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0;
    }
    .reserve-values {
      display: flex; justify-content: space-between;
      margin-top: 10px;
    }
    .reserve-val-block { text-align: center; }
    .reserve-val-number {
      font-size: 1.1rem; font-weight: 700; font-family: 'DM Mono', monospace;
    }
    .reserve-val-label {
      font-size: 0.7rem; color: var(--text-muted); margin-top: 1px;
    }
    .reserve-val-block.keep .reserve-val-number { color: #10a37f; }
    .reserve-val-block.trade .reserve-val-number { color: #6366f1; }

    /* ── FOOTER ── */
    .panel-footer { padding: 16px 20px; border-top: 1px solid var(--border); flex-shrink: 0; }
    #save-prefs {
      width: 100%; padding: 10px; background: var(--primary); color: white;
      border: none; border-radius: 10px; font-size: 0.88rem; font-weight: 600;
      font-family: 'DM Sans', sans-serif; cursor: pointer; transition: background 0.2s;
    }
    #save-prefs:hover { background: var(--primary-dark); }
    #save-note {
      text-align: center; font-size: 0.75rem; color: var(--primary);
      margin-top: 8px; height: 16px; transition: opacity 0.3s; opacity: 0;
    }
    #save-note.show { opacity: 1; }

    /* ── PROFILE ── */
    .profile-note {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.74rem; color: var(--text-muted);
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px;
    }
    .profile-field {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 0; border-bottom: 1px solid var(--border);
    }
    .profile-field:last-child { border-bottom: none; }
    .profile-field-label { font-size: 0.83rem; color: var(--text); font-weight: 500; }
    .profile-number {
      font-size: 1rem; font-weight: 700; color: var(--primary);
      font-family: 'DM Mono', monospace;
    }
    .profile-badge {
      font-size: 0.75rem; font-weight: 600;
      padding: 3px 10px; border-radius: 20px; letter-spacing: 0.02em;
    }
    .profile-badge[data-value="true"] {
      background: rgba(16,163,127,0.1); color: var(--primary);
      border: 1px solid rgba(16,163,127,0.25);
    }
    .profile-badge[data-value="false"] {
      background: var(--bg); color: var(--text-muted); border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <img src="/static/Logo_MAS4TE_EN.png" alt="MAS4TE Logo">
      <div>
        <div class="header-title">MAS4TE Assistant</div>
        <div class="header-subtitle">Smart Energy Management</div>
      </div>
    </div>
    <div id="battery-indicator"></div>
  </header>

  <div class="main-layout">

    <!-- CHAT -->
    <div class="chat-area">
      <div id="chat-box"></div>
      <div class="input-area">
        <input id="user-input" placeholder="Message MAS4TE Assistant…" autocomplete="off"
          onkeydown="if(event.key==='Enter') sendMessage()"/>
        <button id="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>

    <!-- SIDE PANEL -->
    <div id="side-panel">

      <div class="panel-tabs">
        <button class="panel-tab active" id="tab-prefs"   onclick="switchTab('prefs')">Preferences</button>
        <button class="panel-tab"        id="tab-profile" onclick="switchTab('profile')">Profile</button>
      </div>

      <!-- PREFERENCES -->
      <div id="panel-prefs" class="tab-content">
        <div class="panel-body">

          <!-- RISK SCORE — commented out for now
          <div class="pref-section">
            <label>Risk Score</label>
            <div class="step-slider-wrap">
              <div class="step-track">
                <div class="step-fill" id="risk-fill"></div>
                <div class="step-dots" id="risk-dots"></div>
                <input type="range" class="step-range" id="risk-range" min="0" max="2" step="1" value="1">
              </div>
              <div class="step-labels" id="risk-labels"></div>
            </div>
          </div>
          -->

          <div class="pref-section">
            <label>Trading Preference</label>
            <div class="step-slider-wrap">
              <div class="step-track">
                <div class="step-fill" id="pref-fill"></div>
                <div class="step-dots" id="pref-dots"></div>
                <input type="range" class="step-range" id="pref-range" min="0" max="1" step="1" value="1">
              </div>
              <div class="step-labels" id="pref-labels"></div>
            </div>
          </div>

          <!-- EXPERTISE LEVEL — commented out for now -->
          <div class="pref-section">
            <label>Expertise Level</label>
            <div class="step-slider-wrap">
              <div class="step-track">
                <div class="step-fill" id="expertise-fill"></div>
                <div class="step-dots" id="expertise-dots"></div>
                <input type="range" class="step-range" id="expertise-range" min="0" max="2" step="1" value="0">
              </div>
              <div class="step-labels" id="expertise-labels"></div>
            </div>
          </div>
          

          <!-- BATTERY RESERVE — only shown when profile has a home battery -->
          <div class="pref-section" id="battery-reserve-section">
            <label>Battery Reserve</label>
            <div class="reserve-slider-wrap">
              <div class="reserve-track" id="reserve-track">
                <div class="reserve-keep-fill"  id="reserve-keep-fill"></div>
                <div class="reserve-trade-fill" id="reserve-trade-fill"></div>
                <div class="reserve-thumb"      id="reserve-thumb"></div>
                <input type="range" class="reserve-range" id="reserve-range"
                  min="0" max="100" step="5" value="20">
              </div>
              <!-- kWh display shown once battery capacity is known -->
              <div id="reserve-kwh-row" style="display:none; margin-top:6px;">
                <div style="text-align:center; font-size:0.75rem; color:var(--text-muted);">
                  Based on your
                  <span style="font-weight:600; color:var(--text);" id="reserve-capacity-label">—</span>
                  battery:
                  keep <span style="font-weight:700; color:#10a37f;" id="reserve-keep-kwh">—</span> kWh ·
                  trade up to <span style="font-weight:700; color:#6366f1;" id="reserve-trade-kwh">—</span> kWh
                </div>
              </div>
              <div class="reserve-legend">
                <div class="reserve-legend-item">
                    <div class="reserve-legend-dot" style="background:#10a37f;"></div>
                    <span>Keep <strong id="reserve-keep-pct">20%</strong><span id="reserve-keep-label"></span></span>
                </div>
                <div class="reserve-legend-item">
                    <div class="reserve-legend-dot" style="background:#6366f1;"></div>
                    <span>Trade <strong id="reserve-trade-pct">80%</strong><span id="reserve-trade-label"></span></span>
                </div>
            </div>
            </div>
          </div>

          <div class="pref-summary" id="pref-summary"></div>

        </div>
        <div class="panel-footer">
          <button id="save-prefs" onclick="savePreferences()">Save Preferences</button>
          <div id="save-note">✓ Preferences saved!</div>
        </div>
      </div>

      <!-- PROFILE -->
      <div id="panel-profile" class="tab-content" style="display:none;">
        <div class="panel-body">

          <div class="profile-note">
            <svg width="13" height="13" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
            </svg>
            Loaded from system — read only
          </div>

          <div class="profile-field">
            <div class="profile-field-label">People in household</div>
            <span class="profile-number" id="profile-people">3</span>
          </div>
          <div class="profile-field">
            <div class="profile-field-label">Electric car</div>
            <div class="profile-badge" data-value="true" id="profile-ev">Yes</div>
          </div>
          <div class="profile-field">
            <div class="profile-field-label">Heat pump</div>
            <div class="profile-badge" data-value="false" id="profile-heatpump">No</div>
          </div>
          <div class="profile-field">
            <div class="profile-field-label">Solar panels</div>
            <div class="profile-badge" data-value="true" id="profile-solar">Yes</div>
          </div>
          <div class="profile-field">
            <div class="profile-field-label">Electric water heating</div>
            <div class="profile-badge" data-value="false" id="profile-water">No</div>
          </div>
          <div class="profile-field">
            <div class="profile-field-label">Home battery</div>
            <div class="profile-badge" data-value="true" id="profile-battery">Yes</div>
          </div>
          <div class="profile-field" id="profile-battery-capacity-row" style="display:none;">
            <div class="profile-field-label">Battery capacity</div>
            <span class="profile-number" id="profile-battery-capacity">—</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ── STEP SLIDER DATA (risk & expertise kept for future use) ──
    const RISK_STEPS = [
      { label: 'Low',    color: '#10a37f' },
      { label: 'Medium', color: '#f59e0b' },
      { label: 'High',   color: '#ef4444' },
    ];
    const PREF_STEPS = [
      { label: 'Profit', color: '#6366f1' },
      { label: 'Green',  color: '#22c55e' },
    ];
    const EXPERTISE_STEPS = [
      { label: 'Beginner',     color: '#10a37f' },
      { label: 'Intermediate', color: '#f59e0b' },
      { label: 'Expert',       color: '#6366f1' },
    ];

    // commented-out sliders still track state so save payload stays consistent
    let riskValue      = 1;
    let prefValue      = 1; //0 is profit, 1 is green
    let expertiseValue = 0;
    let batteryReserve = 20;      // % to always keep
    let batteryCapacityKwh = null; // filled from profile if available

    // ── STEP SLIDER BUILDER ──
    function buildSlider(dotsId, labelsId, fillId, rangeId, steps, getValue, setValue) {
      const dotsEl   = document.getElementById(dotsId);
      const labelsEl = document.getElementById(labelsId);
      const rangeEl  = document.getElementById(rangeId);
      if (!dotsEl || !labelsEl || !rangeEl) return; // guard for commented-out elements

      dotsEl.innerHTML = '';
      steps.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.className = 'step-dot';
        dot.onclick = () => { setValue(i); refresh(); };
        dotsEl.appendChild(dot);
      });

      labelsEl.innerHTML = '';
      steps.forEach((s, i) => {
        const lbl = document.createElement('div');
        lbl.className = 'step-label';
        lbl.textContent = s.label;
        lbl.onclick = () => { setValue(i); refresh(); };
        labelsEl.appendChild(lbl);
      });

      rangeEl.oninput = () => { setValue(parseInt(rangeEl.value)); refresh(); };

      function refresh() {
        const v = getValue();
        const color = steps[v].color;
        const maxIdx = steps.length - 1;
        document.getElementById(fillId).style.width = maxIdx ? `${(v/maxIdx)*100}%` : '0%';
        document.getElementById(fillId).style.background = color;
        dotsEl.querySelectorAll('.step-dot').forEach((d, i) => {
          d.classList.toggle('active', i === v);
          d.style.background  = i === v ? color : '';
          d.style.borderColor = i === v ? color : '';
        });
        labelsEl.querySelectorAll('.step-label').forEach((l, i) => {
          l.classList.toggle('active', i === v);
          l.style.color = i === v ? color : '';
        });
        rangeEl.value = v;
        updateSummary();
      }

      refresh();
    }

    // ── BATTERY RESERVE SLIDER ──
    function initBatteryReserveSlider() {
      const rangeEl = document.getElementById('reserve-range');
      rangeEl.oninput = () => {
        batteryReserve = parseInt(rangeEl.value);
        refreshReserve();
      };
      refreshReserve();
    }

    function refreshReserve() {
      const keep  = batteryReserve;
      const trade = 100 - keep;

      document.getElementById('reserve-keep-pct').textContent  = keep  + '%';
      document.getElementById('reserve-trade-pct').textContent = trade + '%';

      document.getElementById('reserve-keep-fill').style.width  = keep  + '%';
      document.getElementById('reserve-trade-fill').style.left  = keep  + '%';
      document.getElementById('reserve-trade-fill').style.width = trade + '%';
      document.getElementById('reserve-thumb').style.left       = keep  + '%';

      // round corners on edge cases
      const keepFill  = document.getElementById('reserve-keep-fill');
      const tradeFill = document.getElementById('reserve-trade-fill');
      keepFill.style.borderRadius  = keep  === 100 ? '6px' : '6px 0 0 6px';
      tradeFill.style.borderRadius = trade === 100 ? '6px' : '0 6px 6px 0';
      tradeFill.style.display      = trade === 0 ? 'none' : 'block';
      keepFill.style.display       = keep  === 0 ? 'none' : 'block';

      // kWh breakdown if capacity is known
      if (batteryCapacityKwh) {
        const keepKwh  = ((keep  / 100) * batteryCapacityKwh).toFixed(1);
        const tradeKwh = ((trade / 100) * batteryCapacityKwh).toFixed(1);
        document.getElementById('reserve-keep-kwh').textContent  = keepKwh;
        document.getElementById('reserve-trade-kwh').textContent = tradeKwh;
      }

      updateSummary();
    }

    function updateSummary() {
      // risk and expertise commented out but values still available
      const p = PREF_STEPS[prefValue].label;
      let html = `Strategy: <span>${p === 'Green' ? '🌱 Green' : '💰 Profit'}</span>`;
      // if (document.getElementById('battery-reserve-section').style.display !== 'none') {
      if (document.getElementById('battery-reserve-section').style.display === 'block') {
        const trade = 100 - batteryReserve;
        html += ` · <span>🔋 Keep ${batteryReserve}% · Trade ${trade}%</span>`;
      }
      
      document.getElementById('pref-summary').innerHTML = html;
    }

    function initSliders() {
      // risk and expertise sliders are commented out in HTML but kept here for when re-enabled
      // buildSlider('risk-dots','risk-labels','risk-fill','risk-range', RISK_STEPS, ()=>riskValue, v=>{riskValue=v;});
      buildSlider('pref-dots','pref-labels','pref-fill','pref-range', PREF_STEPS, ()=>prefValue, v=>{prefValue=v;});
      buildSlider('expertise-dots','expertise-labels','expertise-fill','expertise-range', EXPERTISE_STEPS, ()=>expertiseValue, v=>{expertiseValue=v;});
      initBatteryReserveSlider();
    }

    // ── TABS ──
    function switchTab(tab) {
      document.getElementById('panel-prefs').style.display   = tab==='prefs'   ? 'flex' : 'none';
      document.getElementById('panel-profile').style.display = tab==='profile' ? 'flex' : 'none';
      document.getElementById('tab-prefs').classList.toggle('active',   tab==='prefs');
      document.getElementById('tab-profile').classList.toggle('active', tab==='profile');
    }

    // ── PROFILE ──
    async function loadProfile() {
      try {
        const res = await fetch('/prosumer/profile');
        const d = await res.json();
        if (d.people != null) document.getElementById('profile-people').textContent = d.people;
        setBadge('profile-ev',       d.electric_car);
        setBadge('profile-heatpump', d.heat_pump);
        setBadge('profile-solar',    d.solar_panels);
        setBadge('profile-water',    d.electric_water_heating);
        setBadge('profile-battery',  d.home_battery);
       

        // Battery reserve section: only show if profile has a home battery
        if (d.home_battery) {
          document.getElementById('battery-reserve-section').style.display = 'block';

          // If the profile includes battery capacity in kWh, wire it up
          if (d.battery_capacity_kwh != null) {
            batteryCapacityKwh = d.battery_capacity_kwh;
            document.getElementById('reserve-capacity-label').textContent = d.battery_capacity_kwh + ' kWh';
            document.getElementById('reserve-kwh-row').style.display = 'block';
            // also show it in the profile tab
            document.getElementById('profile-battery-capacity-row').style.display = 'flex';
            document.getElementById('profile-battery-capacity').textContent = d.battery_capacity_kwh + ' kWh';
          }

          refreshReserve();
        }
      } 
      catch(e) {
        // Keep placeholder values until endpoint is ready.
        // For development: simulate a battery profile so the slider is visible.
        // Remove the block below once the real endpoint is live.
        document.getElementById('battery-reserve-section').style.display = 'block';
        refreshReserve();
      }
    }

    function setBadge(id, val) {
      if (val == null) return;
      const el = document.getElementById(id);
      el.dataset.value = val ? 'true' : 'false';
      el.textContent = val ? 'Yes' : 'No';
    }

    // ── SAVE ──
    async function savePreferences() {
      const note = document.getElementById('save-note');
      try {
        const res = await fetch('/prosumer/preferences', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            // risk: RISK_STEPS[riskValue].label,         // commented out for now
            trading_preference: PREF_STEPS[prefValue].label,
            // battery_reserve_pct: batteryReserve,
            battery_tradeable_pct: 100 - batteryReserve,
            expertise: EXPERTISE_STEPS[expertiseValue].label, 
          })
        });
        if (!res.ok) throw new Error();
        note.textContent = '✓ Preferences saved!';
        note.style.color = 'var(--primary)';
      } catch(e) {
        note.textContent = '✗ Failed to save, try again';
        note.style.color = '#ef4444';
      }
      note.classList.add('show');
      setTimeout(() => note.classList.remove('show'), 2200);
    }

    // ── INIT ──
    window.onload = function() {
      initSliders();
      loadProfile();
      document.getElementById('chat-box').innerHTML = `
        <div class="message assistant-message">
          Hello! I'm your MAS4TE Assistant. You can ask me about your battery status, energy consumption, or actions on the market.
        </div>`;
      fetchBatteryStatus();
    };

    // ── CHAT ──
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const msg = input.value.trim();
      if (!msg) return;
      input.value = '';
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML += `<div class="message user-message">${escapeHTML(msg)}</div>`;
      chatBox.innerHTML += `<div id="typing-indicator" class="message assistant-message">Thinking…</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: msg,
            preferences: {
              // risk: RISK_STEPS[riskValue].label,    // commented out for now
              trading_preference: PREF_STEPS[prefValue].label,
              //battery_reserve_pct: batteryReserve,
              battery_tradeable_pct: 100 - batteryReserve,
            }
          })
        });
        const data = await res.json();
        document.getElementById('typing-indicator').remove();
        chatBox.innerHTML += `<div class="message assistant-message">${escapeHTML(data.response)}</div>`;
      } catch(e) {
        document.getElementById('typing-indicator').remove();
        chatBox.innerHTML += `<div class="message assistant-message">Sorry, there was an error. Please try again.</div>`;
      }
      chatBox.scrollTop = chatBox.scrollHeight;
      fetchBatteryStatus();
    }

    async function fetchBatteryStatus() {
      try {
        const res = await fetch('/battery/status');
        const d = await res.json();
        const pct = Math.round(d.percent);
        const charging = d.status === 'charging' ? ' ⚡' : '';
        const color = pct < 20 ? '#ef4444' : pct < 50 ? '#f59e0b' : '#10a37f';
        document.getElementById('battery-indicator').innerHTML =
          `<div class="battery-pill">🔋 <span style="color:${color};font-weight:600">${pct}%</span>${charging}</div>`;
      } catch(e) {}
    }

    function escapeHTML(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }
  </script>
</body>
</html>
